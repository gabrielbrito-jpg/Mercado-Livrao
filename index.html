<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mercado Livrão</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

    <header class="topo">
        <a class="logo" href="/">
            <span class="logo-icone">🧺</span>
            <span>Mercado <strong>Livrão</strong></span>
        </a>
        <div class="busca">
            <input type="text" id="busca" placeholder="Buscar produtos, marcas e muito mais...">
            <button onclick="pesquisar()">Buscar</button>
        </div>
        <div class="saldo">
            <span>Seu saldo</span>
            <strong id="saldo">R$ 0,00</strong>
        </div>
    </header>

    <nav class="abas">
        <a href="/" class="ativa"><svg viewBox="0 0 24 24"><path d="M4 9l1.5-5h13L20 9M4 9h16v11H4zM9 20v-6h6v6"/></svg><span>Loja</span></a>
        <a href="/minhas-compras"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="1"/><path d="M8 3v4M16 3v4M4 10h16M10 15l2 2 4-4"/></svg><span>Minhas compras</span></a>
        <a href="/vender"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="14" rx="1"/><path d="M6 3h12M12 10v6M9 13h6"/></svg><span>Vender</span></a>
        <a href="/relatorios"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span>Relatórios</span></a>
    </nav>

    <div id="mensagem"></div>

    <main>
            <div class="filtros">
                <select id="filtro-categoria" onchange="buscarProdutos()">
                    <option value="">Todas as categorias</option>
                </select>
                <input type="number" id="preco-min" placeholder="Preço mín." min="0">
                <input type="number" id="preco-max" placeholder="Preço máx." min="0">
                <select id="ordem" onchange="buscarProdutos()">
                    <option value="">Ordenar por</option>
                    <option value="preco_asc">Menor preço</option>
                    <option value="preco_desc">Maior preço</option>
                    <option value="melhor_avaliado">Melhor avaliados</option>
                    <option value="mais_vendido">Mais vendidos</option>
                </select>
                <button onclick="buscarProdutos()">Filtrar</button>
                <button class="secundario" onclick="limparFiltros()">Limpar</button>
            </div>
            <div id="produtos" class="grade"></div>
    </main>

    <footer class="rodape">Mercado Livrão · Projeto Flask + HTML/CSS/JS · Colégio UNASP-HT</footer>

    <!-- DETALHE DO PRODUTO -->
    <dialog id="modal">
        <button class="fechar" onclick="fecharModalBotao()">✕</button>
        <div id="detalhe"></div>
    </dialog>

    <script src="/static/js/app.js"></script>
</body>
</html>
